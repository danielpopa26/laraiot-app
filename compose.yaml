services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: laraiot_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - laraiot-network
    depends_on:
      mariadb:
        condition: service_healthy

  webserver:
    image: nginx:alpine
    container_name: laraiot_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - laraiot-network

  mariadb:
    image: mariadb:11.2
    container_name: laraiot_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-laraiot}
      MYSQL_USER: ${DB_USERNAME:-laraiot_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - laraiot-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  reverb:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: laraiot_reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8085}:8080"
    volumes:
      - ./:/var/www
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - laraiot-network

  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: laraiot_mosquitto
    restart: unless-stopped
    ports:
      - "${LARAIOT_MQTT_PORT:-1883}:1883"
    volumes:
      - ./.docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - laraiot-network

  mqtt-listener:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: laraiot_mqtt_listener
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan laraiot:mqtt-listen
    volumes:
      - ./:/var/www
    depends_on:
      mariadb:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
      app:
        condition: service_started
    networks:
      - laraiot-network

networks:
  laraiot-network:
    driver: bridge

volumes:
  mariadb_data:
  mosquitto_data:
  mosquitto_log: